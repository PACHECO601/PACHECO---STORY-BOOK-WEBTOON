<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Animex</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="signup-layout">

        <section class="signup-panel">
            <a href="index.html" class="back-button">
                <span>‹</span> Go Back
            </a>

            <div class="signup-content">

                <div class="brand-icon">
                    <span>A</span>
                </div>

                <header class="signup-heading">
                    <h1>ANI<span>MEX</span></h1>
                    <h2>CREATE ACCOUNT</h2>
                    <div class="heading-divider">
                        <span></span>
                    </div>
                    <p>Join Animex and start your reading adventure.</p>
                </header>

                <form class="signup-form" id="signupForm">

                    <button type="button" class="google-button" id="googleSignup">
                        <span class="google-icon">G</span>
                        Continue with Google
                    </button>

                    <div class="separator">
                        <span></span>
                        <p>OR</p>
                        <span></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉</span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">♙</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Min 8 characters"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">♡</span>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>

                    <label class="terms-label">
                        <input type="checkbox" id="terms" required>
                        <span>
                            I agree to the
                            <a href="terms.html">Terms of Service</a>
                            and
                            <a href="privacy.html">Privacy Policy</a>
                        </span>
                    </label>

                    <p class="form-message" id="formMessage" aria-live="polite"></p>

                    <button type="submit" class="create-account">
                        Create Account
                    </button>

                    <div class="login-link">
                        Already have an account?
                        <a href="login.html">Log in</a>
                    </div>

                </form>
            </div>
        </section>

        <aside class="art-panel">
            <div class="art-overlay"></div>
        </aside>

    </main>

    <script src="signup.js"></script>
</body>
</html>
